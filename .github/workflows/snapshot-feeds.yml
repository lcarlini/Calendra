# Saves the deal community feeds into the site, so the Deals page can read them from the same origin
# (no CORS relay, no rss2json rate limit):
#   data/deals-adrenaline-ofertas.xml   Adrenaline Ofertas RSS (robots.txt allows it)
#   data/deals/community.json           a week of recent deals from Gatry (public API), Promobit, Oferta Esperta and Pelando
name: Snapshot deal feed

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snapshot-feeds.yml', 'scripts/snapshot_deals.py', 'scripts/snapshot-deals.mjs', 'js/deals/price-parsers.js']

permissions:
  contents: write

concurrency:
  group: calendra-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the Adrenaline Ofertas feed (direct, else rss2json)
        run: python3 scripts/snapshot_deals.py
      - name: Build the community deal pool
        run: node scripts/snapshot-deals.mjs
      - name: Commit the snapshot if it changed
        run: |
          git config user.name 'calendra-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Deal feed snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
