# Saves a copy of the deal community feed into the site, so the Deals page can read it from the same origin
# (no CORS relay, no rss2json rate limit). Only the public RSS feed that robots.txt allows is fetched.
name: Snapshot deal feed

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snapshot-feeds.yml']

permissions:
  contents: write

concurrency:
  group: snapshot-feeds
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Adrenaline Ofertas RSS feed
        run: |
          set -eu
          mkdir -p data
          tmp=$(mktemp)
          if curl -fsSL --max-time 60 --retry 3 --retry-delay 10 \
               -A 'Mozilla/5.0 (compatible; CalendraFeedSnapshot/1.0; +https://lcarlini.github.io/Calendra/)' \
               'https://forum.adrenaline.com.br/forums/ofertas.221/index.rss' -o "$tmp" \
             && grep -q '<rss' "$tmp" && grep -q '<item>' "$tmp"; then
            mv "$tmp" data/deals-adrenaline-ofertas.xml
            date -u +%Y-%m-%dT%H:%M:%SZ > data/deals-adrenaline-ofertas.updated
          else
            echo "::warning::Feed fetch failed or returned no items; keeping the previous snapshot."
            head -c 400 "$tmp" || true
          fi
      - name: Commit the snapshot if it changed
        run: |
          git config user.name 'calendra-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet -- data/deals-adrenaline-ofertas.xml; then
            echo "Feed unchanged."
            exit 0
          fi
          git commit -m "Deal feed snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
